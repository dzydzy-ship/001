# ---------------------------------------------------------------------------
# 热点采集配置
# ---------------------------------------------------------------------------
# 每个源是否启用、采集条数都在这里改，不用动代码。
# 采集失败会自动跳过（只记日志）；全部源都失败时回退到内置演示热点。

sources:
  # 今日头条热榜：官方公开 JSON 接口，无需登录，综合热度高
  toutiao:
    enabled: true
    label: 今日头条热榜
    limit: 30

  # B 站排行榜：官方公开 JSON 接口，视频热度
  bilibili:
    enabled: true
    label: B站排行榜
    limit: 30

  # B 站分区排行榜：按板块分别拉榜，保证「游戏 / 食品 / 美妆 / 数码 / 运动」等
  # 板块在热点看板里都有真实内容（rid 为 B 站分区 ID）。
  bilibili_parts:
    enabled: true
    label: B站分区榜
    limit: 12
    parts:
      - {rid: 4,   label: 游戏, category: 游戏}
      - {rid: 211, label: 美食, category: 食品}
      - {rid: 155, label: 时尚, category: 美妆}
      - {rid: 188, label: 数码, category: 数码}
      - {rid: 234, label: 运动, category: 运动健身}
      - {rid: 36,  label: 科技, category: 数码}
      - {rid: 5,   label: 娱乐, category: 影视}
      - {rid: 160, label: 生活, category: 家居}

  # 知乎日报：官方公开 JSON 接口，每日精选（无热度值，按名次折算）
  zhihu_daily:
    enabled: true
    label: 知乎日报
    limit: 20

  # DailyHotApi 聚合接口（可选）：需自部署或使用可访问的公开实例
  # 公开演示站 api-hot.imsyy.top 在部分网络下不可解析，故默认关闭。
  # 自部署：docker run -p 6688:6688 imsyy/dailyhot-api:latest
  dailyhot:
    enabled: false
    label: DailyHot
    base_url: "http://127.0.0.1:6688"
    platforms: [bilibili, weibo, zhihu, douyin, toutiao]
    limit: 20

