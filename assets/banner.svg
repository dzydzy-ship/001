<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="AI 商家营销运营助手">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1023"/>
      <stop offset="0.45" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b3b5c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.16" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e0e7ff" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glowA)"/>
  <rect width="1280" height="320" fill="url(#glowB)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>

  <!-- 右侧装饰：同心圆 + 连线 -->
  <g stroke="#a5b4fc" stroke-opacity="0.28" fill="none" stroke-width="1.2">
    <circle cx="1080" cy="150" r="58"/>
    <circle cx="1080" cy="150" r="96"/>
    <circle cx="1080" cy="150" r="136"/>
  </g>
  <g fill="#e0e7ff" fill-opacity="0.9">
    <circle cx="1080" cy="150" r="5" fill="#22d3ee"/>
    <circle cx="1138" cy="150" r="4"/>
    <circle cx="1080" cy="54" r="4"/>
    <circle cx="1013" cy="217" r="4"/>
    <circle cx="1152" cy="245" r="4"/>
  </g>
  <g stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.2" fill="none">
    <path d="M1080 150 L1152 245"/>
    <path d="M1080 150 L1013 217"/>
    <path d="M1080 150 L1080 54"/>
  </g>

  <!-- 左侧文字组 -->
  <g font-family="'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
    <rect x="72" y="64" width="176" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#c7d2fe" stroke-opacity="0.4"/>
    <text x="160" y="84" font-size="14" fill="#c7d2fe" text-anchor="middle" letter-spacing="1.5">FULL-STACK AI DEMO</text>

    <text x="72" y="150" font-size="54" font-weight="700" fill="#f8fafc" letter-spacing="1">AI 商家营销运营助手</text>
    <rect x="72" y="172" width="300" height="4" rx="2" fill="url(#accent)"/>

    <text x="72" y="214" font-size="20" fill="#c7d2fe" letter-spacing="0.6">商品智能加工 · 热点 × 商品匹配 · 利润防护 Agent · 平台化内容生成</text>

    <g font-size="14" fill="#e0e7ff">
      <rect x="72" y="240" width="112" height="30" rx="8" fill="#6366f1" fill-opacity="0.22" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="128" y="260" text-anchor="middle">商品结构化</text>
      <rect x="196" y="240" width="112" height="30" rx="8" fill="#6366f1" fill-opacity="0.22" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="252" y="260" text-anchor="middle">两阶段匹配</text>
      <rect x="320" y="240" width="126" height="30" rx="8" fill="#6366f1" fill-opacity="0.22" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="383" y="260" text-anchor="middle">利润防护 Agent</text>
      <rect x="458" y="240" width="126" height="30" rx="8" fill="#6366f1" fill-opacity="0.22" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="521" y="260" text-anchor="middle">多平台内容生成</text>
    </g>

    <text x="72" y="298" font-size="13" fill="#94a3b8" letter-spacing="0.5">FastAPI · SQLAlchemy · SQLite · 单页前端零构建 · 一键启动脚本</text>
  </g>

  <rect x="0" y="317" width="1280" height="3" fill="url(#rule)"/>
</svg>
