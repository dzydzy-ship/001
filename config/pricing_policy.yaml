# 促销利润防护口径（平台无关字段 + 商家确认后的默认值）
#
# 说明：这里的数值是"演示口径"，来自一家真实经营的自营进口模型店铺；
# 换平台/换店铺时**只改本文件，不改代码**。
# 所有金额单位：元；比例均为小数。

version: 1

# 毛利率红线：利润 / 成交额 低于该值即触发风险提示（单位：百分数）
profit_floor_pct: 5.0

# 商家确认过的默认口径。凡未确认的字段一律进"追问清单"，不得默认猜。
defaults:
  commission_rate: 0.06          # 平台佣金率（技术服务费）
  commission_base: gmv_after_coupon  # 佣金基数：券后成交额（含买家支付的运费）
  ship_fee: 19.9                 # 买家支付的运费（每单）
  freight_dom: 19.9              # 国内运费（卖家承担，每单）
  freight_cover: 0.0             # 平台包邮补贴覆盖的国内运费
  freight_intl: 0.0              # 跨国运输分摊（每件），国内零售为 0
  tier_discounts:                # 满件折扣（店铺营销设置）
    "2": 0.8                     # 两件及以上八折
    "3": 0.75                    # 三件及以上七五折
  coupon_borne_by: merchant
  default_coupon: 29.0      # 券由商家承担；平台补贴券按 0 计

# 追问话术：缺哪个字段就问哪一句，一次只问必要的问题
clarify:
  unit_cost: "这款商品的进货成本（出厂价）是多少？我不会替你估。"
  price: "店铺标价是多少？"
  freight_intl: "从海外发回来的运费，分摊到每件大概多少？"
  coupon_borne_by: "这张券是商家承担，还是有平台补贴？"

# 越权拦截话术：涉及改价/发券/改活动，一律不动手
refusal:
  write_action: "改价、发券、修改活动配置都要回到店铺后台由你自己确认——这一步我不能替你做。我可以把改完之后的账算给你看，但不会替你点那个「发布」按钮。"
  unknown_sku: "店铺里没有找到这款商品，你可以先在「商品管理」里建一条，或者直接把标价和进价告诉我。"

# 明确划出边界：哪些事这个技能永远不做
boundaries:
  - 只读测算（dry-run）：不调任何店铺写接口，不自动改价、不自动发券
  - 口径由商家确认：模型不推断佣金基数、补贴归属与结算规则
  - 每个数字可追溯：解释中的金额只能引用引擎字段，不得由模型自行推算
  - 退货率、广告费暂不计入：新店无历史数据，计入反而不诚实
